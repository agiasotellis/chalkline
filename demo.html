<script>(function(){var r=document.documentElement;function want(){if(window.__chalkTheme)return window.__chalkTheme;try{return localStorage.getItem("chalkline.theme.v2")==="dark"?"dark":"light"}catch(e){return"light"}}r.dataset.theme=want();try{var L=localStorage.getItem("chalkline.locale");if(L==="el"||L==="en")r.lang=L}catch(e){}new MutationObserver(function(){var w=want();if(r.dataset.theme!==w)r.dataset.theme=w}).observe(r,{attributes:true,attributeFilter:["data-theme"]})})()</script>
</head>
